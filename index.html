<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAP Pilotage | Mes agents et Planner</title>

  <style>
    :root {
      --bleu: #0070ad;
      --fond: #f3f6fa;
      --texte: #172b4d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--texte);
      background: var(--fond);
    }

    header {
      padding: 32px 24px;
      color: white;
      background: linear-gradient(120deg, #003b64, var(--bleu));
    }

    header > div,
    main {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      line-height: 1.5;
    }

    main {
      padding: 24px;
    }

    .notice {
      padding: 16px;
      margin-bottom: 24px;
      background: #e7f3fb;
      border-radius: 12px;
      line-height: 1.6;
    }

    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .carte {
      display: flex;
      flex-direction: column;
      padding: 24px;
      background: white;
      border: 1px solid #dde5ef;
      border-radius: 16px;
      box-shadow: 0 5px 18px #172b4d08;
    }

    .carte.planner {
      border-top: 4px solid #16844a;
    }

    .icone {
      font-size: 32px;
    }

    h2 {
      font-size: 20px;
      margin: 16px 0 8px;
    }

    .description {
      flex: 1;
      line-height: 1.5;
      color: #53657c;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--bleu);
      color: white;
    }

    button:hover {
      background: #005789;
    }

    button:disabled {
      background: #dce3eb;
      color: #53657c;
      cursor: not-allowed;
    }

    .planner .ouvrir:not(:disabled) {
      background: #16844a;
    }
